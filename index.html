<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eballer - Pool Game | Lipa na M-Pesa</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,Arial}
body{background:#0f1215;color:#fff;min-height:100vh}
.header{background:#151a1f;padding:15px;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #00ff88}
.logo{font-weight:900;font-size:22px;color:#00ff88}
.balance{background:#00ff88;color:#000;padding:8px 16px;border-radius:20px;font-weight:800}
.container{max-width:500px;margin:20px auto;padding:0 15px}
.card{background:#1c232a;border-radius:16px;padding:20px;margin-bottom:15px;border:1px solid #2a3440}
.paybill-box{background:linear-gradient(135deg,#00ff88,#00cc6a);color:#000;border-radius:12px;padding:15px;margin:15px 0;font-weight:800}
.paybill-box .row{display:flex;justify-content:space-between;margin:8px 0}
.paybill-box .val{background:#000;color:#00ff88;padding:4px 10px;border-radius:6px;font-family:monospace;font-size:18px}
input{width:100%;padding:14px;background:#0f1215;border:1px solid #2a3440;border-radius:10px;color:#fff;margin:8px 0;font-size:16px}
.btn{width:100%;padding:16px;border:none;border-radius:12px;font-weight:900;font-size:16px;cursor:pointer;margin-top:10px}
.btn-green{background:#00ff88;color:#000}
.btn-outline{background:transparent;border:2px solid #00ff88;color:#00ff88}
.item{background:#151a1f;padding:12px;border-radius:10px;margin:8px 0;display:flex;justify-content:space-between;align-items:center;border-left:4px solid #ffa500}
.admin{background:#1a1515;border:1px solid #ff4444}
.unlock-btn{background:#00ff88;color:#000;border:none;padding:8px 14px;border-radius:8px;font-weight:800}
h3{margin-bottom:12px;color:#00ff88}
.step{font-size:13px;color:#8a9bb0;margin:4px 0}
.step b{color:#fff}
</style>
</head>
<body>
<div class="header">
<div class="logo">EBALLER</div>
<div class="balance" id="balance">KES 0</div>
</div>
<div class="container">
<div class="card">
<h3>💰 Deposit - Lipa na M-Pesa (MANUAL)</h3>
<div class="paybill-box">
<div class="row"><span>Paybill</span><span class="val">714777</span></div>
<div class="row"><span>Account</span><span class="val">0141939000</span></div>
</div>
<p class="step"><b>1:</b> M-Pesa > Paybill > 714777</p>
<p class="step"><b>2:</b> Account 0141939000 + Amount</p>
<p class="step"><b>3:</b> Paste M-Pesa Code below</p>
<input type="text" id="pName" placeholder="Your Name">
<input type="tel" id="pPhone" placeholder="Phone 07...">
<input type="number" id="pAmount" placeholder="Amount" value="150">
<input type="text" id="pCode" placeholder="M-Pesa Code TJ..." style="text-transform:uppercase;border:2px solid #00ff88">
<button class="btn btn-green" onclick="submitDeposit()">SUBMIT FOR VERIFICATION</button>
</div>
<div class="card">
<h3>📋 My Deposits</h3>
<div id="myDeposits"></div>
</div>
<div class="card admin">
<h3>🔓 UNLOCK DESK (Admin)</h3>
<p class="step">Check Loop app 0141939000, then tap UNLOCK</p>
<input type="password" id="adminPass" value="1234">
<div id="adminList" style="margin-top:10px"></div>
<button class="btn btn-outline" onclick="clearAll()">Clear Data</button>
</div>
</div>
<script>
let deposits=JSON.parse(localStorage.getItem('eballer_deposits')||'[]');
let bal=parseInt(localStorage.getItem('eballer_bal')||'0');
function updateUI(){
document.getElementById('balance').innerText='KES '+bal;
document.getElementById('myDeposits').innerHTML=deposits.map(d=>`<div class="item"><div><b>${d.amount} KES - ${d.mpesaCode}</b><br><small>${d.status}</small></div></div>`).join('')||'No deposits';
document.getElementById('adminList').innerHTML=deposits.filter(d=>d.status=='PENDING').map(d=>`<div class="item"><div><b>${d.amount} KES</b><br><small>${d.phone}<br>${d.mpesaCode}</small></div><button class="unlock-btn" onclick="unlock('${d.id}')">UNLOCK</button></div>`).join('')||'All unlocked';
}
function submitDeposit(){
const name=document.getElementById('pName').value;
const phone=document.getElementById('pPhone').value;
const amount=document.getElementById('pAmount').value;
const code=document.getElementById('pCode').value.toUpperCase();
if(!phone||!code||!amount){alert('Fill all');return;}
deposits.unshift({id:Date.now().toString(),name,phone,amount:parseInt(amount),mpesaCode:code,status:'PENDING'});
localStorage.setItem('eballer_deposits',JSON.stringify(deposits));
document.getElementById('pCode').value='';updateUI();alert('Submitted! Code: '+code);
}
function unlock(id){
if(document.getElementById('adminPass').value!=='1234'){alert('PIN 1234');return;}
const d=deposits.find(x=>x.id==id);if(confirm(`Unlock ${d.amount} from ${d.phone}?`)){d.status='APPROVED';bal+=parseInt(d.amount);localStorage.setItem('eballer_deposits',JSON.stringify(deposits));localStorage.setItem('eballer_bal',bal.toString());updateUI();}
}
function clearAll(){deposits=[];bal=0;localStorage.clear();updateUI();}
updateUI();
</script>
</body>
</html>
