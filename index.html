<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>E-Baller S1</title>
<style>body{background:#0a0a0f;color:#fff;font-family:Arial;padding:10px}.card{background:#1a1a2e;border:2px solid #00ff88;border-radius:12px;padding:12px;margin:8px 0}.btn{background:#00ff88;color:#000;padding:14px;border:none;border-radius:10px;font-weight:bold;width:100%}.wa{background:#25D366;color:#fff}</style></head><body>

<div class="card" style="text-align:center">
<h2 style="color:#00ff88;margin:0">E-FOOTBALL S1</h2>
<p>Winner 1000 KES • Entry 50 KES</p>
<p>PAYBILL 714777 ACC 0141939000</p>
<a href="https://chat.whatsapp.com/EuhWoFsaY7Y8f6XJYjFeM0" class="btn wa" style="display:block;text-decoration:none;text-align:center">💬 JOIN GROUP DIRECT</a>
<p id="c" style="color:#00ff88"></p>
</div>

<div class="card" id="reg"><h3>Pay & Register</h3>
<input id="n" placeholder="Your Name" style="width:92%;padding:10px;margin:4px;border-radius:8px">
<select id="cl" style="width:97%;padding:10px;margin:4px;border-radius:8px"><option>Arsenal</option><option>Man City</option><option>Man Utd</option><option>Liverpool</option><option>Chelsea</option><option>Barcelona</option><option>Real Madrid</option><option>Bayern</option><option>PSG</option><option>Inter</option></select>
<input id="code" placeholder="Mpesa Code" style="width:92%;padding:10px;margin:4px;border-radius:8px">
<button class="btn" onclick="reg()">REGISTER - WAIT APPROVAL</button>
</div>

<div class="card" id="pend" style="display:none;text-align:center;border-color:#ffcc00"><h3>⏳ WAITING - DESK LOCKED</h3><p id="pt"></p><a href="https://chat.whatsapp.com/EuhWoFsaY7Y8f6XJYjFeM0" class="btn wa" style="display:block;text-decoration:none;text-align:center">GO TO GROUP</a><button onclick="localStorage.clear();location.reload()" style="background:#333;color:#fff;padding:8px;border:none;border-radius:8px;margin-top:8px;width:100%">Reset</button></div>

<div id="ok" style="display:none">
<div class="card" style="border-color:#00ff88"><h3>✅ UNLOCKED - <span id="mc"></span></h3></div>
<div class="card"><h3>🏆 Table</h3><div id="tb"></div></div>
<div class="card"><h3>📅 Your Fixtures</h3><div id="mf"></div><h3>All Fixtures</h3><div id="af"></div></div>
</div>

<script>
let P=JSON.parse(localStorage.getItem('eballer_players')||'[]'),Q=JSON.parse(localStorage.getItem('eballer_pending')||'[]'),F=JSON.parse(localStorage.getItem('eballer_fixtures')||'[]'),T=JSON.parse(localStorage.getItem('eballer_table')||'[]'),M=JSON.parse(localStorage.getItem('eballer_myClub')||'null');
function upd(){document.getElementById('c').innerText=P.length+'/32 Approved';}
upd();
function reg(){let n=document.getElementById('n').value,c=document.getElementById('cl').value,cd=document.getElementById('code').value;if(!n||!cd)return alert('Enter details');if(P.find(x=>x.club==c))return alert('Taken');Q.push({name:n,club:c,code:cd});M={name:n,club:c,code:cd};localStorage.setItem('eballer_pending',JSON.stringify(Q));localStorage.setItem('eballer_myClub',JSON.stringify(M));chk();}
function chk(){M=JSON.parse(localStorage.getItem('eballer_myClub')||'null');if(!M){regCard();return}if(P.find(p=>p.club==M.club)){show();}else if(Q.find(q=>q.club==M.club)){pendCard();}else{localStorage.removeItem('eballer_myClub');regCard();}}
function regCard(){document.getElementById('reg').style.display='block';document.getElementById('pend').style.display='none';document.getElementById('ok').style.display='none';}
function pendCard(){document.getElementById('reg').style.display='none';document.getElementById('pend').style.display='block';document.getElementById('ok').style.display='none';document.getElementById('pt').innerText=M.name+' - '+M.club+' | '+M.code+'\nDesk 🔒 Locked - Admin will Unlock soon';}
function show(){document.getElementById('reg').style.display='none';document.getElementById('pend').style.display='none';document.getElementById('ok').style.display='block';document.getElementById('mc').innerText=M.club;let h='';T.sort((a,b)=>b.Pts-a.Pts);T.forEach((t,i)=>{h+=`<div style="padding:6px;border-bottom:1px solid #333;${t.Club==M.club?'background:#00ff8822;color:#00ff88':''}">${i+1}. ${t.Club} - ${t.Pts}pts (${t.MP}MP)</div>`});document.getElementById('tb').innerHTML=h;let mf=F.filter(f=>f.home==M.club||f.away==M.club),mh='';if(!mf.length)mh='No fixtures yet';else mf.forEach(f=>{mh+=`<div style="padding:5px;border-bottom:1px solid #222">${f.played?'✅':'⏳'} ${f.home} ${f.played?f.hg+'-'+f.ag:''} ${f.away}</div>`});document.getElementById('mf').innerHTML=mh;let ah='';F.slice(0,20).forEach(f=>{ah+=`<div style="padding:4px;border-bottom:1px solid #222;font-size:12px">${f.played?'✅':'⏳'} GW${f.week}: ${f.home} ${f.played?f.hg+'-'+f.ag:''} ${f.away}</div>`});document.getElementById('af').innerHTML=ah||'No fixtures';}
chk();
</script></body></html>
