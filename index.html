<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EBALLER ONLINE - KISUMU 16 | Champion 1000 KES</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:#0a0e13;color:#fff;min-height:100vh}
.header{background:linear-gradient(135deg,#00ff88,#00ccff);padding:16px;text-align:center;color:#000}
.header h1{font-size:22px;font-weight:900}
.topbar{display:flex;justify-content:space-between;padding:10px 12px;background:#11151c;font-size:12px;border-bottom:1px solid #222}
.topbar b{color:#00ff88}
.card{margin:12px;background:#151a23;border-radius:16px;padding:14px;border:1px solid #222}
.btn{width:100%;padding:14px;border-radius:12px;border:0;font-weight:900;font-size:15px;cursor:pointer}
.btn-join{background:#00ff88;color:#000}
.btn-admin{background:#222;color:#00ff88;border:1px solid #00ff88;margin-top:10px}
.input{width:100%;padding:12px;border-radius:10px;border:1px solid #333;background:#0a0e13;color:#fff;margin:8px 0}
.players{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.pill{background:#0a0e13;border:1px solid #333;padding:8px 10px;border-radius:10px;font-size:12px;display:flex;justify-content:space-between}
.match{background:#0a0e13;border:1px solid #333;border-radius:10px;padding:8px;margin:8px 0;font-size:12px}
.winner{color:#00ff88;font-weight:900}
.tab.active{background:#00ff88;color:#000}
.tabs{display:flex;gap:8px;margin:12px}
.tab{flex:1;padding:10px;text-align:center;background:#11151c;border-radius:10px;font-size:13px;font-weight:700;border:1px solid #222}
.hidden{display:none}
.admin-box{background:#0f1a14;border:1px solid #00ff88}
</style>
</head>
<body>
<div class="header">
<h1>⚡ EBALLER ONLINE</h1>
<div style="font-size:12px;font-weight:700">KISUMU 16 • CHAMPION 1000 KES • 0753998388</div>
</div>
<div class="topbar">
<div>Players: <b id="pcount">0/16</b></div>
<div>LOOP: <b>420200874887</b></div>
<div>Entry: <b>50 KES</b></div>
</div>
<div class="tabs">
<div class="tab active" onclick="showTab('join',this)">JOIN</div>
<div class="tab" onclick="showTab('bracket',this)">BRACKET</div>
<div class="tab" onclick="showTab('results',this)">RESULTS</div>
</div>
<div id="tab-join">
<div class="card"><h3>🏆 Prize: Champion 1000 KES | Runner 500 | LOOP 420200874887 | Owner 0753998388</h3></div>
<div class="card">
<h3>🎮 Join Tournament</h3>
<input id="pname" class="input" placeholder="eFootball Name e.g. Sydatoke">
<button class="btn btn-join" onclick="join()">JOIN BATTLE - 50 KES</button>
<div id="plist" class="players"></div>
<button class="btn btn-admin" onclick="askAdmin()">🔐 ADMIN: Update Results</button>
</div>
</div>
<div id="tab-bracket" class="hidden"><div class="card"><div id="bracket" style="display:flex;gap:12px;overflow-x:auto"></div></div></div>
<div id="tab-results" class="hidden"><div class="card"><div id="resultsBox"></div><button class="btn btn-admin" onclick="shareResults()">📤 Share to WhatsApp</button></div></div>
<div id="adminPanel" class="card admin-box hidden"><h3>🔐 ADMIN 0753998388</h3><div id="adminMatches"></div><br><button class="btn" style="background:#ff3b30;color:#fff" onclick="resetTourney()">RESET</button> <button class="btn btn-admin" onclick="closeAdmin()">Close</button></div>
<script>
let players=JSON.parse(localStorage.getItem('eballer_v2_players')||'[]');
let matches=JSON.parse(localStorage.getItem('eballer_v2_matches')||'null');
const MAX=16; const ADMIN_PASS="0753998388";
function save(){localStorage.setItem('eballer_v2_players',JSON.stringify(players));localStorage.setItem('eballer_v2_matches',JSON.stringify(matches));render();}
function join(){let n=document.getElementById('pname').value.trim();if(!n)return alert('Enter name');if(players.length>=MAX)return alert('Full');if(players.find(p=>p.name.toLowerCase()===n.toLowerCase()))return alert('Exists');players.push({name:n,paid:false});document.getElementById('pname').value='';generateMatches();save();alert(n+' joined! Send 50 to LOOP 420200874887');}
function generateMatches(){if(players.length<2)return;if(!matches||matches.length===0){matches=[];for(let i=0;i<players.length;i+=2){if(players[i+1])matches.push({r:1,m:i/2+1,p1:players[i].name,p2:players[i+1].name,winner:''});}}}
function render(){document.getElementById('pcount').innerText=players.length+'/'+MAX;let h='';players.forEach((p,i)=>{h+=`<div class="pill"><span>${i+1}. ${p.name}</span><span>${p.paid?'PAID':'UNPAID'}</span></div>`;});document.getElementById('plist').innerHTML=h||'No players';renderBracket();renderResults();}
function renderBracket(){let el=document.getElementById('bracket');if(!matches||matches.length===0){el.innerHTML='Need 4+ players';return;}let rounds={1:[],2:[],3:[],4:[]};matches.forEach(m=>{rounds[m.r].push(m)});for(let r=1;r<4;r++){let wins=(rounds[r]||[]).filter(m=>m.winner).map(m=>m.winner);if(wins.length>=2){for(let i=0;i<wins.length;i+=2){if(wins[i+1]&&!matches.find(x=>x.r===r+1&&(x.p1===wins[i]||x.p2===wins[i]))){matches.push({r:r+1,m:Math.floor(i/2)+1,p1:wins[i],p2:wins[i+1],winner:''});}}}}let html='';[1,2,3,4].forEach(r=>{if(rounds[r]&&rounds[r].length){let name=r===1?'R16':r===2?'QF':r===3?'SF':'FINAL';html+=`<div style="min-width:140px"><div style="color:#00ff88;font-weight:900;font-size:11px">${name}</div>`;rounds[r].forEach(m=>{html+=`<div class="match"><div class="${m.winner===m.p1?'winner':''}">${m.p1} ${m.winner===m.p1?'🏆':''}</div><div style="color:#666;font-size:10px;text-align:center">vs</div><div class="${m.winner===m.p2?'winner':''}">${m.p2} ${m.winner===m.p2?'🏆':''}</div>${m.winner?`<div style="color:#00ff88">Winner:${m.winner}</div>`:''}</div>`;});html+='</div>';}});el.innerHTML=html;}
function renderResults(){if(!matches){document.getElementById('resultsBox').innerHTML='No matches';return;}let h='';matches.forEach(m=>{h+=`R${m.r} M${m.m}: ${m.p1} vs ${m.p2} → ${m.winner?`<b style="color:#00ff88">${m.winner} won</b>`:'pending'}<br>`;});let champ=matches.filter(m=>m.winner).slice(-1)[0];if(champ&&champ.r>=3)h+=`<br><div style="background:#00ff88;color:#000;padding:10px;border-radius:10px;font-weight:900">🏆 CHAMPION: ${champ.winner} - 1000 KES!</div>`;document.getElementById('resultsBox').innerHTML=h;}
function showTab(t,el){document.getElementById('tab-join').classList.add('hidden');document.getElementById('tab-bracket').classList.add('hidden');document.getElementById('tab-results').classList.add('hidden');document.getElementById('tab-'+t).classList.remove('hidden');document.querySelectorAll('.tab').forEach(e=>e.classList.remove('active'));el.classList.add('active');}
function askAdmin(){let p=prompt('Admin Phone:');if(p===ADMIN_PASS){document.getElementById('adminPanel').classList.remove('hidden');renderAdmin();}else alert('Wrong');}
function closeAdmin(){document.getElementById('adminPanel').classList.add('hidden');}
function renderAdmin(){if(!matches){document.getElementById('adminMatches').innerHTML='Need players';return;}let h='';matches.forEach((m,i)=>{if(!m.winner)h+=`<div class="match">${m.p1} vs ${m.p2}<div style="display:flex;gap:6px;margin-top:6px"><button onclick="setWinner(${i},'${m.p1}')" style="flex:1;padding:8px;background:#00ff88;border:0;border-radius:8px;font-weight:900">${m.p1} Won</button><button onclick="setWinner(${i},'${m.p2}')" style="flex:1;padding:8px;background:#00ccff;border:0;border-radius:8px;font-weight:900">${m.p2} Won</button></div></div>`;});players.forEach((p,i)=>{h+=`<div class="pill">${p.name}<button onclick="togglePaid(${i})" style="padding:4px 8px;border-radius:6px;border:0;background:${p.paid?'#00ff88':'#333'};color:${p.paid?'#000':'#fff'}">${p.paid?'PAID':'Mark Paid'}</button></div>`;});document.getElementById('adminMatches').innerHTML=h||'All done';}
function setWinner(i,w){matches[i].winner=w;save();renderAdmin();}
function togglePaid(i){players[i].paid=!players[i].paid;save();renderAdmin();}
function resetTourney(){if(confirm('RESET?')&&prompt('Type RESET')==='RESET'){players=[];matches=null;localStorage.clear();render();closeAdmin();}}
function shareResults(){let txt=`⚡ EBALLER KISUMU RESULTS ⚡\n`;matches.filter(m=>m.winner).forEach(m=>{txt+=`R${m.r}: ${m.p1} vs ${m.p2} → ${m.winner} won\n`;});txt+=`\nLive: https://sydyatoke-cell.github.io/eballer-online/\nLOOP 420200874887`;window.open(`https://wa.me/?text=${encodeURIComponent(txt)}`);}
render();
</script>
</body>
</html>
