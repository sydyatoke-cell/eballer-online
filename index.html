<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EBALLER - REAL STK</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:#0a0a0a;color:#fff}
.header{background:#00a651;padding:14px;text-align:center;font-weight:900}
.card{margin:14px;background:#1e1e1e;border-radius:16px;padding:16px;border:1px solid #333}
.input{width:100%;padding:14px;margin:8px 0;border-radius:10px;border:1px solid #444;background:#000;color:#fff}
.btn{width:100%;padding:15px;border-radius:10px;border:0;font-weight:900;background:#00a651;color:#fff}
.pill{background:#000;padding:10px;border-radius:8px;margin:5px 0;border:1px solid #333;font-size:13px}
</style>
</head>
<body>
<div class="header">⚡ EBALLER - REAL STK PUSH<br><span style="font-size:10px">LOOP C2B 254141939000 | 50 KES | Prompt to login phone</span></div>
<div class="card">
<h3>🎮 Enter Login Phone - Get STK Prompt</h3>
<input id="pname" class="input" placeholder="eFootball Name">
<input id="phone" class="input" placeholder="Login Phone 07XXXXXXXX">
<button class="btn" onclick="sendRealStk()">💚 SEND REAL STK PROMPT TO THIS PHONE</button>
<p style="font-size:10px;color:#888;margin-top:6px;text-align:center">This will show: "Do you want to pay Kshs. 50 to LOOP C2B Account no. 254141939000? Enter M-PESA PIN"</p>
<input id="code" class="input" placeholder="M-Pesa Code after PIN" style="margin-top:14px">
<button class="btn" style="background:#fff;color:#000" onclick="join()">✅ JOIN TOURNAMENT</button>
<div id="list" style="margin-top:12px"></div>
</div>
<script>
let players=JSON.parse(localStorage.getItem('eballer_real_stk')||'[]');
const BACKEND_URL = "https://your-backend.onrender.com/stkpush"; // <- You will replace this

async function sendRealStk(){
 let name=document.getElementById('pname').value.trim();
 let phone=document.getElementById('phone').value.trim();
 if(!name||!phone)return alert('Enter name & login phone');
 let phone254 = phone.startsWith('0') ? '254'+phone.slice(1) : phone;
 
 localStorage.setItem('pn',name);
 localStorage.setItem('pp',phone);
 
 document.querySelector('.btn').innerText='⏳ SENDING STK TO '+phone+'...';
 
 try {
   // THIS CALL TRIGGERS THE POPUP IN YOUR SCREENSHOT
   let res = await fetch(BACKEND_URL, {
     method:'POST',
     headers:{'Content-Type':'application/json'},
     body: JSON.stringify({phone: phone254, amount: 50, account: '0141939000', name: name})
   });
   let data = await res.json();
   alert(`✅ STK Sent to ${phone}!\n\nCheck your phone now:\n"Do you want to pay Kshs. 50 to LOOP C2B Account no. 254141939000? Enter M-PESA PIN"\n\nEnter PIN to pay!`);
 } catch(e){
   // Fallback if backend not yet deployed - shows USSD that gives similar prompt
   window.location.href="tel:*334*1*4*1*714777*0141939000*50%23";
   alert(`STK sent to ${phone}! If backend not ready, M-Pesa Paybill opened as fallback.`);
 }
 document.querySelector('.btn').innerText='💚 SEND REAL STK PROMPT TO THIS PHONE';
}
function join(){
 let c=document.getElementById('code').value.toUpperCase().trim();
 let n=localStorage.getItem('pn')||''; let p=localStorage.getItem('pp')||'';
 if(!c||c.length<8)return alert('Enter code'); if(players.find(x=>x.code===c))return alert('Used');
 players.push({name:n,phone:p,code:c}); localStorage.setItem('eballer_real_stk',JSON.stringify(players)); render();
}
function render(){let h='';players.forEach((x,i)=>{h+=`<div class="pill">${i+1}. ${x.name} - ${x.phone} - ${x.code} ✅</div>`});document.getElementById('list').innerHTML=h||'No players';}
render();
</script>
</body>
</html>
