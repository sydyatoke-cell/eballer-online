<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}body{background:#0a0a0a;color:#fff}.h{background:#1a1515;padding:15px;border-bottom:2px solid #ff4444}.c{max-width:600px;margin:15px auto;padding:12px}.card{background:#1c1a1a;border-radius:12px;padding:15px;margin-bottom:15px;border:1px solid #333}.i{width:100%;padding:12px;background:#0f0f0f;border:1px solid #333;border-radius:8px;color:#fff;margin:6px 0}.btn{padding:12px 20px;border:none;border-radius:8px;font-weight:800;cursor:pointer}.g{background:#00ff88;color:#000}.item{background:#151515;padding:12px;border-radius:10px;margin:8px 0;display:flex;justify-content:space-between;border-left:4px solid #ffa500}</style></head><body><div class="h"><b style="color:#ff4444">EBALLER ADMIN - LOOP 0141939000</b></div><div class="c"><div class="card"><input class="i" type="password" id="pin" placeholder="PIN 1234"><button class="btn g" style="width:100%" onclick="login()">LOGIN</button><div id="bStatus" style="margin-top:8px;font-size:12px;color:#888"></div></div><div id="desk" style="display:none"><div class="card"><h3>Pending - Verify in Loop App</h3><div id="pend"></div><button class="btn" style="background:#222;color:#fff;width:100%;margin-top:10px" onclick="load()">Refresh</button></div></div></div><script>const BACKEND="https://eballer-backend.onrender.com";function login(){if(document.getElementById('pin').value!=='1234')return alert('PIN 1234');document.getElementById('desk').style.display='block';load();}async function load(){document.getElementById('bStatus').innerText='Loading '+BACKEND+'...';try{let r=await fetch(BACKEND+'/api/deposits');let deps=await r.json();let pend=deps.filter(d=>d.status==='PENDING');document.getElementById('bStatus').innerText='Backend OK - '+deps.length+' deposits';document.getElementById('pend').innerHTML=pend.map(d=>`<div class="item"><div><b>${d.amount} KES</b><br><small>${d.phone}<br>${d.mpesaCode}<br>${d.time}</small></div><button class="btn g" onclick="approve('${d.id}')">UNLOCK</button></div>`).join('')||'No pending';}catch(e){document.getElementById('bStatus').innerText='Cannot reach backend - check Render URL';}}async function approve(id){if(!confirm('Saw in Loop 0141939000? Unlock?'))return;await fetch(BACKEND+'/api/approve/'+id,{method:'POST'});alert('Unlocked!');load();}</script></body></html>
