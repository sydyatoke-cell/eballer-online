<script>
let players = JSON.parse(localStorage.getItem('eballer_players')||'[]');
let pending = JSON.parse(localStorage.getItem('eballer_pending')||'[]');
let fixtures = JSON.parse(localStorage.getItem('eballer_fixtures')||'[]');
let table = JSON.parse(localStorage.getItem('eballer_table')||'[]');

function save(){
  localStorage.setItem('eballer_players', JSON.stringify(players));
  localStorage.setItem('eballer_pending', JSON.stringify(pending));
  localStorage.setItem('eballer_fixtures', JSON.stringify(fixtures));
  localStorage.setItem('eballer_table', JSON.stringify(table));
  render();
}

function render(){
  document.getElementById('count').innerText = players.length+'/32 | '+pending.length+' waiting';
  let pH = '';
  if(!pending.length){
    pH = '<p style="color:#888">No pending</p>';
  } else {
    pending.forEach((p,i)=>{
      pH += '<div style="background:#111;padding:10px;margin:6px 0;border-radius:8px;display:flex;justify-content:space-between"><span><b>'+p.name+'</b> <span style="color:#ffcc00">('+p.club+')</span><br><small>'+p.code+'</small></span><span><button class="btn g" onclick="approve('+i+')">OK</button><button class="btn wa" onclick="approveAndShare('+i+')">OK+SHARE</button><button class="btn r" onclick="reject('+i+')">X</button></span></div>';
    });
  }
  document.getElementById('pendingList').innerHTML = pH;

  table.sort((a,b)=>b.Pts-a.Pts);
  let tH = '';
  table.forEach((t,i)=>{
    let real = players.find(p=>p.club==t.Club);
    tH += '<tr><td>'+(i+1)+'</td><td style="color:#00ff88">'+t.Club+'</td><td>'+(real?real.name:'-')+'</td><td>'+t.Pts+'</td><td><button class="btn r" onclick="removeP(\''+t.Club+'\')">Del</button></td></tr>';
  });
  document.getElementById('tableBody').innerHTML = tH;

  let opts = players.map(p=>'<option>'+p.club+'</option>').join('');
  document.getElementById('h').innerHTML = opts;
  document.getElementById('a').innerHTML = opts;

  let fH = '';
  fixtures.forEach((f,i)=>{
    fH += '<div style="padding:6px;border-bottom:1px solid #333;display:flex;justify-content:space-between"><span>'+(f.played?'✅':'⏳')+' '+f.home+' '+(f.played?f.hg+'-'+f.ag:'')+' '+f.away+'</span><span>'+(!f.played?'<button class="btn g" onclick="qEnd('+i+')">End</button>':'<button class="btn r" onclick="disq('+i+')">Disq</button>')+'</span></div>';
  });
  document.getElementById('fixList').innerHTML = fH;
}

function approve(i){
  let p = pending[i];
  players.push(p);
  table.push({Club:p.club, MP:0, Pts:0});
  pending.splice(i,1);
  save();
}

function approveAndShare(i){
  let p = pending[i];
  players.push(p);
  table.push({Club:p.club, MP:0, Pts:0});
  pending.splice(i,1);
  save();
  let text = '*DESK UNLOCKED* ✅%0A*'+p.name+' ('+p.club+')* Approved! Welcome to E-Baller S1%0A%0AFull Table: https://sydyatoke-cell.github.io/eballer-online/%0AGroup: '+GROUP;
  window.open('https://wa.me/?text='+text, '_blank');
}

function reject(i){
  pending.splice(i,1);
  save();
}

function removeP(c){
  if(!confirm('Remove '+c)) return;
  players = players.filter(p=>p.club!=c);
  table = table.filter(t=>t.Club!=c);
  fixtures = fixtures.filter(f=>f.home!=c && f.away!=c);
  save();
}

  window.open('https://wa.me/?text='+text, '_blank');
}
