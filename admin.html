<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>E-Baller League Standings</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@800&family=Inter:wght@600;800&display=swap');
*{box-sizing:border-box}body{margin:0;background:#060b18;color:#fff;font-family:Inter,sans-serif;min-height:100vh;padding:8px}
.hero{position:relative;border-radius:18px;overflow:hidden;background:radial-gradient(600px 300px at 20% 10%,#1e3a8a 0%,#060b18 60%),radial-gradient(500px 300px at 90% 0%,#0a2a6b 0%,#000 70%);border:1px solid #1e3a8a;padding:10px 12px 0 12px}
.logo{font-family:Orbitron;font-size:28px;font-weight:800}.logo span.e{color:#ffeb3b;background:#0a1a4a;border-radius:50%;padding:2px 8px;margin-right:2px}
.title{font-family:Orbitron;font-size:32px;line-height:0.9;text-align:center;margin:6px 0;font-weight:800;background:linear-gradient(#fff,#94a3b8);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.sub{font-family:Orbitron;text-align:center;color:#38bdf8;font-size:14px;margin:10px 0 12px 0;letter-spacing:2px;text-shadow:0 0 10px #38bdf8}
.table-wrap{background:linear-gradient(180deg,rgba(255,255,255,0.07),rgba(0,0,0,0.6));border:1px solid #ffffff22;border-radius:14px;overflow:hidden}
.header-row{display:grid;grid-template-columns:1.8fr 0.4fr 0.4fr 0.4fr 0.4fr 0.6fr 0.6fr 0.6fr 0.6fr;color:#fde68a;font-size:12px;padding:10px;border-bottom:1px solid #ffffff22;text-align:center}
.header-row div:first-child{text-align:left}
.row{display:grid;grid-template-columns:1.8fr 0.4fr 0.4fr 0.4fr 0.4fr 0.6fr 0.6fr 0.6fr 0.6fr;padding:10px;align-items:center;border-bottom:1px solid #ffffff11;font-size:14px;text-align:center}
.row div:first-child{text-align:left;display:flex;gap:6px;overflow:hidden}
.rank{width:28px;font-weight:800;color:#94a3b8}
.leader{background:linear-gradient(90deg,#facc15,#eab308);color:#000;font-weight:900;box-shadow:0 0 18px #facc15aa}
.leader.rank,.leader div{color:#000!important}
.pos2-3{background:linear-gradient(90deg,#0ea5e922,#1e40af44);border-left:3px solid #38bdf8}
.mid{background:linear-gradient(90deg,#111827,#1f2937)}
.low{background:linear-gradient(90deg,#3f0a0a,#7f1d1d);color:#fecaca}
.pts{color:#facc15;font-weight:900;font-size:16px}
.pin-card{background:#1e293b;padding:12px;border-radius:12px;margin:10px 0}
input,select{width:100%;padding:10px;margin:4px 0;border-radius:8px;border:none}
button{padding:10px;border:none;border-radius:8px;font-weight:bold;cursor:pointer;margin:3px}
.blue{background:#3b82f6;color:#fff}.green{background:#22c55e}.danger{background:#ef4444;color:#fff}.hidden{display:none}.small{font-size:11px;color:#94a3b8}
.admin-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
</style></head><body>
<div class="hero">
<div style="display:flex;justify-content:space-between"><div class="logo"><span class="e">e</span>BALLER</div><div class="small">KISUMU | Loop 0141939000</div></div>
<div class="title">LEAGUE<br>STANDINGS</div>
<div id="loginBox" class="pin-card" style="max-width:340px;margin:10px auto"><input id="pin" type="password" placeholder="Admin PIN 1234"><button class="green" style="width:100%" onclick="unlock()">Unlock Admin Editor</button></div>
<div class="table-wrap"><div class="header-row"><div>👑 TEAM</div><div>P</div><div>W</div><div>D</div><div>L</div><div>GF</div><div>GA</div><div>GD</div><div>PTS</div></div><div id="rows"></div></div>
<div class="sub">THE CHASE IS ON!</div>
</div>
<div id="adminPanel" class="hidden">
<div class="pin-card"><h3>Edit Teams</h3><div id="editList"></div><div style="display:flex;gap:6px"><button class="green" onclick="addTeam()">+ Add</button><button class="blue" onclick="saveAll()">💾 Save</button><button class="danger" onclick="resetSample()">Reset</button></div></div>
<div class="pin-card"><h4>Add Result</h4><div class="admin-grid"><select id="teamA"></select><input id="scoreA" type="number" placeholder="Score A"><select id="teamB"></select><input id="scoreB" type="number" placeholder="Score B"></div><button class="blue" style="width:100%;margin-top:6px" onclick="addResult()">Add Result</button><div id="hist" class="small"></div></div>
</div>
<script>
let data=JSON.parse(localStorage.getItem('eballer_league')||'null')||[{name:"Prince Nyaru",P:2,W:2,D:0,L:0,GF:14,GA:4},{name:"Mosalah Jnr",P:2,W:2,D:0,L:0,GF:5,GA:0},{name:"Magnusefb",P:2,W:2,D:0,L:0,GF:14,GA:9},{name:"Stone Of Heaven",P:2,W:1,D:1,L:0,GF:7,GA:1},{name:"Chris Gray",P:2,W:1,D:1,L:0,GF:4,GA:2},{name:"Jah Raze",P:1,W:1,D:0,L:0,GF:3,GA:1},{name:"Ghost",P:2,W:1,D:0,L:1,GF:8,GA:7},{name:"Sydyato",P:2,W:1,D:0,L:1,GF:9,GA:12},{name:"Be Nice",P:2,W:0,D:1,L:1,GF:0,GA:2},{name:"Diaz",P:2,W:0,D:1,L:1,GF:4,GA:9},{name:"Savage",P:1,W:0,D:0,L:1,GF:0,GA:3},{name:"Mdcartel",P:2,W:0,D:0,L:2,GF:6,GA:9},{name:"Muhindi",P:2,W:0,D:0,L:2,GF:6,GA:13},{name:"Leny Yoro",P:2,W:0,D:0,L:2,GF:1,GA:9}];
function calc(){data.forEach(t=>{t.GD=t.GF-t.GA;t.PTS=t.W*3+t.D});data.sort((a,b)=>b.PTS-a.PTS||b.GD-a.GD||b.GF-a.GF)}
function render(){calc();let html='';data.forEach((t,i)=>{let cls=i===0?'row leader':i<3?'row pos2-3':i<5?'row pos2-3':i>=10?'row low':'row mid';let crown=i===0?'👑':'';html+=`<div class="${cls}"><div><span class="rank">${i+1}.</span> ${crown} ${t.name}</div><div>${t.P}</div><div>${t.W}</div><div>${t.D}</div><div>${t.L}</div><div>${t.GF}</div><div>${t.GA}</div><div>${t.GD}</div><div class="pts">${t.PTS}</div></div>`;});rows.innerHTML=html;let edit='';data.forEach((t,i)=>{edit+=`<div style="display:grid;grid-template-columns:2fr 0.5fr 0.5fr 0.5fr 0.5fr 0.6fr 0.6fr 0.4fr;gap:4px;margin:4px 0"><input value="${t.name}" id="n${i}"><input value="${t.P}" type="number" id="p${i}"><input value="${t.W}" type="number" id="w${i}"><input value="${t.D}" type="number" id="d${i}"><input value="${t.L}" type="number" id="l${i}"><input value="${t.GF}" type="number" id="gf${i}"><input value="${t.GA}" type="number" id="ga${i}"><button class="danger" onclick="delTeam(${i})">X</button></div>`;});editList.innerHTML=edit;let opts=data.map(t=>`<option>${t.name}</option>`).join('');teamA.innerHTML=opts;teamB.innerHTML=opts;}
function unlock(){if(pin.value==='1234'){adminPanel.classList.remove('hidden');loginBox.classList.add('hidden')}else alert('Wrong')}
function saveAll(){data=data.map((t,i)=>{return{name:document.getElementById('n'+i).value||t.name,P:+document.getElementById('p'+i).value||0,W:+document.getElementById('w'+i).value||0,D:+document.getElementById('d'+i).value||0,L:+document.getElementById('l'+i).value||0,GF:+document.getElementById('gf'+i).value||0,GA:+document.getElementById('ga'+i).value||0}});localStorage.setItem('eballer_league',JSON.stringify(data));render();alert('Saved!')}
function addTeam(){data.push({name:"New Player",P:0,W:0,D:0,L:0,GF:0,GA:0});render()}
function delTeam(i){if(confirm('Delete '+data[i].name+'?')){data.splice(i,1);localStorage.setItem('eballer_league',JSON.stringify(data));render()}}
function addResult(){let a=teamA.value,b=teamB.value,sa=+scoreA.value,sb=+scoreB.value;if(a===b)return alert('Pick 2 different');if(isNaN(sa)||isNaN(sb))return alert('Scores');let ta=data.find(x=>x.name===a),tb=data.find(x=>x.name===b);ta.P++;tb.P++;ta.GF+=sa;ta.GA+=sb;tb.GF+=sb;tb.GA+=sa;if(sa>sb){ta.W++;tb.L++;}else if(sb>sa){tb.W++;ta.L++;}else{ta.D++;tb.D++;}let h=JSON.parse(localStorage.getItem('eb_hist')||'[]');h.unshift({a,b,sa,sb,time:new Date().toLocaleString()});localStorage.setItem('eb_hist',JSON.stringify(h.slice(0,50)));localStorage.setItem('eballer_league',JSON.stringify(data));scoreA.value='';scoreB.value='';render();renderHist();}
function renderHist(){let h=JSON.parse(localStorage.getItem('eb_hist')||'[]');hist.innerHTML=h.map(x=>`${x.time}: ${x.a} ${x.sa}-${x.sb} ${x.b}`).join('<br>')||'No results'}
