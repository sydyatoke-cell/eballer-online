<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>E-Baller FIXED - NEVER BLANK</title><style>body{margin:0;background:#060b18;color:#fff;font-family:sans-serif;padding:8px}.card{background:#1e293b;padding:12px;border-radius:12px;margin:10px 0}button{padding:12px;border:none;border-radius:8px;font-weight:900;margin:4px;cursor:pointer}.green{background:#22c55e}.blue{background:#3b82f6;color:#fff}.gold{background:#facc15}.red{background:#ef4444;color:#fff}.desk{display:grid;grid-template-columns:1fr 1fr;gap:8px}.box{padding:16px;border-radius:10px;text-align:center;font-weight:900}.free{background:#22c55e;color:#000}.busy{background:#ef4444}.hidden{display:none}input,select{width:100%;padding:12px;border-radius:8px;border:none;margin:4px 0}</style></head><body>
<div class="card" id="loginBox" style="max-width:360px;margin:20px auto;text-align:center"><h2>🎱 E-BALLER DESK</h2><h3>PIN 1234</h3><input id="pin" type="password" placeholder="1234"><button class="green" style="width:100%" onclick="go()">UNLOCK - TAP HERE</button><div id="msg"></div></div>
<div id="main" class="hidden">
<div class="card"><h3>🎱 8 DESKS - Tap to Lock</h3><div id="desks" class="desk"></div></div>
<div class="card"><h3>🏆 TABLE - Auto Updates</h3><div id="rows"></div><button class="green" style="width:100%" onclick="shareTable()">📲 Share Table to WhatsApp Group</button></div>
<div class="card"><h3>⚡ FIXTURES - Auto Picks</h3><div id="fixtures"></div><div style="display:flex"><button class="blue" style="flex:1" onclick="autoPick()">Auto-Pick</button><button class="green" style="flex:1" onclick="startNext()">Start Next</button></div></div>
<div class="card"><h3>🎮 REFEREE - Your Controls</h3><select id="liveMatch"></select><select id="deskSel"><option>Table 1</option><option>Table 2</option><option>Table 3</option><option>Table 4</option><option>Table 5</option><option>Table 6</option><option>Table 7</option><option>Table 8</option></select><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px"><button class="green" onclick="award()">🏆 Award Winner</button><button class="blue" onclick="unlockDesk()">🔓 Unlock Desk</button><button class="gold" onclick="post()">⏸️ Postpone</button><button class="red" onclick="disq()">🚫 Disqualify</button></div><div id="hist" style="font-size:10px;margin-top:8px"></div></div>
</div>
<script>
var league=[{n:"Prince Nyaru",P:0,W:0,L:0,PTS:0},{n:"Mosalah Jnr",P:0,W:0,L:0,PTS:0},{n:"Magnusefb",P:0,W:0,L:0,PTS:0},{n:"Stone Of Heaven",P:0,W:0,L:0,PTS:0},{n:"Chris Gray",P:0,W:0,L:0,PTS:0},{n:"Jah Raze",P:0,W:0,L:0,PTS:0},{n:"Ghost",P:0,W:0,L:0,PTS:0},{n:"Sydyato",P:0,W:0,L:0,PTS:0}];
var fixtures=[];var desks={};for(var i=1;i<=8;i++)desks["Table "+i]="free";var hist=[];
function go(){var p=document.getElementById("pin").value;if(p=="1234"){document.getElementById("loginBox").style.display="none";document.getElementById("main").classList.remove("hidden");init();}else{document.getElementById("msg").innerHTML="Wrong - use 1234";}}
function init(){autoPick();render();}
function render(){var h="";league.sort((a,b)=>b.PTS-a.PTS);league.forEach((t,i)=>{h+="<div style='display:flex;justify-content:space-between;padding:6px;border-bottom:1px solid #333;"+(i==0?"background:gold;color:#000;font-weight:900":"")+"'><span>"+(i+1)+". "+(i==0?"👑 ":"")+t.n+"</span><span>P:"+t.P+" W:"+t.W+" PTS:"+t.PTS+"</span></div>";});document.getElementById("rows").innerHTML=h;renderDesks();renderFix();}
function renderDesks(){var d=document.getElementById("desks");d.innerHTML="";for(var i=1;i<=8;i++){var name="Table "+i;var st=desks[name];var div=document.createElement("div");div.className="box "+(st=="free"?"free":"busy");div.innerHTML=name+"<br><small>"+st+"</small>";div.setAttribute("data-t",name);div.onclick=function(){var tn=this.getAttribute("data-t");if(desks[tn]=="free"){var m=prompt("Match? e.g. Otis vs Brian");if(m)desks[tn]="busy: "+m;}else{desks[tn]="free";}renderDesks();};d.appendChild(div);}}
function renderFix(){var f=document.getElementById("fixtures");f.innerHTML="";fixtures.forEach((fx,i)=>{var div=document.createElement("div");div.style="background:#0f172a;padding:8px;margin:4px 0;border-radius:6px;display:flex;justify-content:space-between";div.innerHTML="<span><b>"+fx.a+" vs "+fx.b+"</b><br><small>"+fx.table+" - "+fx.status+"</small></span><button class='blue' onclick='setLive("+i+")'>Start</button>";f.appendChild(div);});var sel=document.getElementById("liveMatch");sel.innerHTML="";fixtures.forEach((fx,i)=>{if(fx.status!="done"){var o=document.createElement("option");o.value=i;o.text=fx.a+" vs "+fx.b+" @ "+fx.table;sel.appendChild(o);}});document.getElementById("hist").innerHTML=hist.join("<br>");}
function autoPick(){fixtures=[];for(var i=0;i<league.length;i+=2){if(league[i+1])fixtures.push({a:league[i].n,b:league[i+1].n,table:"Table "+((i/2)%8+1),status:"upcoming",winner:""});}renderFix();}
function startNext(){for(var i=0;i<fixtures.length;i++){if(fixtures[i].status=="upcoming"){fixtures[i].status="live";desks[fixtures[i].table]="busy: "+fixtures[i].a+" vs "+fixtures[i].b;break;}}render();}
function setLive(i){fixtures[i].status="live";desks[fixtures[i].table]="busy: "+fixtures[i].a+" vs "+fixtures[i].b;render();}
function award(){var sel=document.getElementById("liveMatch");var idx=sel.value;if(idx===""){alert("Pick match");return;}var fx=fixtures[idx];var w=prompt("Who won? Type exact: "+fx.a+" or "+fx.b,fx.a);if(!w)return;if(w!=fx.a&&w!=fx.b){alert("Type exact name");return;}fx.winner=w;fx.status="done";league.forEach(t=>{if(t.n==fx.a||t.n==fx.b){t.P++;if(t.n==w){t.W++;t.PTS+=3;}}} );desks[fx.table]="free";hist.unshift(new Date().toLocaleTimeString()+" : "+fx.a+" vs "+fx.b+" Winner:"+w+" @"+fx.table);render();var txt="🏆 RESULT - "+fx.a+" vs "+fx.b+" @ "+fx.table+"%0AWinner: *"+w+"*%0A%0Ahttps://sydyatoke-cell.github.io/eballer-online/admin.html";window.open("https://wa.me/?text="+txt,"_blank");}
function unlockDesk(){var t=document.getElementById("deskSel").value;desks[t]="free";renderDesks();alert(t+" Unlocked - FREE");}
function post(){var idx=document.getElementById("liveMatch").value;if(idx==="")return;fixtures[idx].status="postponed";renderFix();}
function disq(){var n=prompt("Player to disqualify?");if(!n)return;if(confirm("Disqualify "+n+"?")){league=league.filter(x=>x.n!=n);fixtures=fixtures.filter(f=>f.a!=n&&f.b!=n);render();}}
function shareTable(){var txt="🎱 *E-BALLER KISUMU - LEAGUE TABLE* 🏆%0A%0A"+league.map((t,i)=>(i+1)+". "+(i==0?"👑 ":"")+t.n+" - P:"+t.P+" W:"+t.W+" PTS:"+t.PTS).join("%0A")+"%0A%0Ahttps://sydyatoke-cell.github.io/eballer-online/admin.html";window.open("https://wa.me/?text="+txt,"_blank");}
</script></body></html>
