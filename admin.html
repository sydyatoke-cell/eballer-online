<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>E-Baller Admin - Kisumu</title>
<style>
body{font-family:sans-serif;background:#0f172a;color:#fff;padding:12px;margin:0}
.card{background:#1e293b;padding:12px;border-radius:12px;margin-bottom:12px}
button{background:#22c55e;color:#000;padding:10px 12px;border:none;border-radius:8px;font-weight:bold;margin:4px;cursor:pointer}
input,select{width:100%;padding:10px;margin:6px 0;border-radius:8px;border:none;box-sizing:border-box}
.danger{background:#ef4444;color:#fff}
.blue{background:#3b82f6;color:#fff}
.orange{background:#f59e0b;color:#000}
.tab{display:flex;gap:6px;overflow:auto;padding-bottom:6px}
.tab button{background:#334155;color:#fff;flex:1}
.tab button.active{background:#fff;color:#000}
.hidden{display:none}
.table-box{padding:16px;border-radius:12px;text-align:center;font-weight:bold}
</style>
</head>
<body>
<h2>🎱 E-Baller Admin - Kisumu</h2>
<p style="color:#94a3b8">Loop: 0141939000 | Tables: 8</p>

<div id="login" class="card">
<input id="pin" type="password" placeholder="Enter PIN 1234">
<button onclick="login()" style="width:100%">Unlock Admin</button>
</div>

<div id="panel" class="hidden">

<div class="card">
<h3 style="margin:0 0 8px 0">📊 TABLE OVERVIEW - See All Tables</h3>
<div id="tableMap" style="display:grid;grid-template-columns:1fr 1fr;gap:8px"></div>
<button class="blue" onclick="renderMap()" style="width:100%;margin-top:8px">Refresh Table View</button>
</div>

<div class="tab">
<button id="t1" class="active" onclick="showTab('fixtures')">Fixtures</button>
<button id="t2" onclick="showTab('unlock')">Unlock Desk</button>
<button id="t3" onclick="showTab('players')">Remove Player</button>
<button id="t4" onclick="showTab('matches')">Disqualify</button>
</div>

<div id="fixtures" class="card">
<h3>Create Fixture & Lock Table</h3>
<input id="p1" placeholder="Player 1 Name / Phone (e.g. Otis 0712...)">
<input id="p2" placeholder="Player 2 Name / Phone">
<select id="table">
<option>Table 1</option><option>Table 2</option><option>Table 3</option><option>Table 4</option><option>Table 5</option><option>Table 6</option><option>Table 7</option><option>Table 8</option></select>
<input id="fee" type="number" placeholder="Fee e.g. 50">
<button onclick="createFixture()" style="width:100%">Create Fixture & Lock Table 🔒</button>
<div id="fixList" style="margin-top:10px"></div>
</div>
<div id="unlock" class="card hidden">
<h3>Unlock Desk - Loop 0141939000</h3>
<button class="blue" onclick="loadDeposits()" style="width:100%">Refresh Deposits</button>
<div id="depList" style="margin-top:10px">No deposits yet.</div>
</div>
<div id="players" class="card hidden">
<h3>Remove a Player</h3>
<input id="removeName" placeholder="Enter Player Phone or Name">
<button class="danger" onclick="removePlayer()" style="width:100%">Remove Player ❌</button>
<div id="playerList" style="margin-top:10px"></div>
</div>
<div id="matches" class="card hidden">
<h3>Disqualify / End Match</h3>
<input id="matchId" placeholder="Table Number e.g. Table 3">
<select id="reason"><option>No Show</option><option>Cheating</option><option>Fight</option><option>Double Booking</option><option>Winner Decided</option></select>
<button class="danger" onclick="disqualify()" style="width:100%">Disqualify / Cancel Match</button>
<button class="blue" onclick="completeMatch()" style="width:100%">Mark as Completed</button>
<button class="orange" onclick="freeTable()" style="width:100%">Free Table (Make Green)</button>
</div>
<button class="danger" onclick="location.reload()" style="width:100%;margin-top:10px">Logout</button>
</div>
<script>
const BACKEND="https://eballer-backend.onrender.com";
let fixtures=JSON.parse(localStorage.getItem('fixtures')||'[]');
function login(){if(document.getElementById('pin').value==='1234'){document.getElementById('login').classList.add('hidden');document.getElementById('panel').classList.remove('hidden');loadAll();}else alert('Wrong PIN');}
function showTab(t){document.querySelectorAll('#fixtures,#unlock,#players,#matches').forEach(e=>e.classList.add('hidden'));document.getElementById(t).classList.remove('hidden');document.querySelectorAll('.tab button').forEach(b=>b.classList.remove('active'));document.getElementById('t'+(t==='fixtures'?1:t==='unlock'?2:t==='players'?3:4)).classList.add('active');}
function createFixture(){if(!p1.value||!p2.value)return alert('Enter both players');let f={id:Date.now(),p1:p1.value,p2:p2.value,table:table.value,fee:fee.value||50,status:'locked',time:new Date().toLocaleString()};fixtures.push(f);save();p1.value='';p2.value='';alert('Fixture Created: '+f.table+' LOCKED');}
function renderFixtures(){fixList.innerHTML=fixtures.slice().reverse().map(f=>`<div class="card" style="background:#334155;margin:6px 0"><b>${f.table}</b>: ${f.p1} vs ${f.p2}<br><small>${f.time} - ${f.status}</small><br><button class="blue" onclick="unlockTable(${f.id})">Unlock</button><button class="danger" onclick="deleteFixture(${f.id})">Delete</button></div>`).join('')||'No fixtures';renderMap();loadPlayers();}
function renderMap(){let html='';for(let i=1;i<=8;i++){let tName='Table '+i;let f=fixtures.find(x=>x.table===tName && !x.status.includes('free'));let color='#22c55e',status='FREE 🟢',detail='Tap Fixtures to assign';if(f){if(f.status.includes('locked')){color='#ef4444';status='LOCKED 🔴';}else if(f.status.includes('disqual')){color='#000';status='DISQUAL ⚫';}else if(f.status.includes('completed')){color='#f59e0b';status='DONE 🟡';}else if(f.status.includes('unlocked')){color='#3b82f6';status='UNLOCKED 🔵';}detail=f.p1+' vs '+f.p2+'<br>'+f.status;}html+=`<div class="table-box" style="background:${color};color:${color==='#000'?'#fff':'#000'}">TABLE ${i}<br>${status}<br><span style="font-size:11px;font-weight:normal">${detail}</span></div>`;}document.getElementById('tableMap').innerHTML=html;}
function save(){localStorage.setItem('fixtures',JSON.stringify(fixtures));renderFixtures();}
function unlockTable(id){fixtures=fixtures.map(f=>f.id===id?{...f,status:'unlocked - ready to play'}:f);save();}
function deleteFixture(id){if(confirm('Delete?')){fixtures=fixtures.filter(f=>f.id!==id);save();}}
function loadDeposits(){depList.innerHTML='Loading...';fetch(BACKEND+'/api/deposits').then(r=>r.json()).then(data=>{depList.innerHTML=data.map(d=>`<div class="card" style="background:#334155">${d.phone} - KES ${d.amount}<br><button onclick="confirmUnlock('${d.phone}','${d.table||'Table 1'}')">UNLOCK</button></div>`).join('')||'No deposits';}).catch(()=>{depList.innerHTML=`<div class="card" style="background:#334155">DEMO: 0712345678 - KES 50<br><button onclick="confirmUnlock('0712345678','Table 1')">UNLOCK Table 1</button></div>`;});}
function confirmUnlock(phone,tableName){if(confirm('Unlock '+tableName+' for '+phone+'?')){fixtures=fixtures.map(f=>f.table===tableName?{...f,status:'unlocked - paid by '+phone}:f);save();alert('Unlocked '+tableName);}}
function removePlayer(){let n=removeName.value.trim();if(!n)return alert('Enter name');fixtures=fixtures.filter(f=>f.p1!==n && f.p2!==n && !f.p1.includes(n) && !f.p2.includes(n));save();alert('Removed '+n);removeName.value='';}
function loadPlayers(){let names=[...new Set(fixtures.flatMap(f=>[f.p1,f.p2]))];playerList.innerHTML=names.map(n=>`<div style="display:flex;justify-content:space-between;background:#334155;padding:6px;margin:4px;border-radius:6px">${n} <button class="danger" onclick="removeName.value='${n}';removePlayer()">X</button></div>`).join('')||'No players';}
function disqualify(){let id=matchId.value.trim();if(!id)return alert('Enter Table');fixtures=fixtures.map(f=>f.table===id||String(f.id)===id?{...f,status:'disqualified - '+reason.value}:f);save();alert('Disqualified '+id);}
function completeMatch(){let id=matchId.value.trim();if(!id)return alert('Enter Table');fixtures=fixtures.map(f=>f.table===id||String(f.id)===id?{...f,status:'completed - '+reason.value}:f);save();alert('Completed '+id);}
function freeTable(){let id=matchId.value.trim();if(!id)return alert('Enter Table');fixtures=fixtures.filter(f=>f.table!==id);save();alert(id+' FREE');}
function loadAll(){renderFixtures();loadPlayers();renderMap();}
</script>
</body>
</html>
