<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>E-Baller Desk Control - Kisumu - FIXED V2</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@800&family=Inter:wght@600&display=swap');
*{box-sizing:border-box}body{margin:0;background:#060b18;color:#fff;font-family:Inter,sans-serif;padding:6px}
.hero{background:radial-gradient(600px at 20% 10%,#1e3a8a 0%,#060b18 60%);border:1px solid #1e3a8a;border-radius:16px;padding:10px}
.logo{font-family:Orbitron;font-size:20px}.logo b{color:#facc15}
.card{background:#1e293b;padding:10px;border-radius:12px;margin:8px 0}
button{padding:10px 12px;border:none;border-radius:8px;font-weight:bold;cursor:pointer;margin:3px}
.green{background:#22c55e;color:#000}.blue{background:#3b82f6;color:#fff}.gold{background:#facc15;color:#000}.red{background:#ef4444;color:#fff}.gray{background:#334155;color:#fff}
.desk{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.deskBox{padding:12px;border-radius:10px;text-align:center;font-weight:bold;cursor:pointer}
.free{background:#22c55e;color:#000}.busy{background:#ef4444;color:#fff}.post{background:#f59e0b;color:#000}

.mrow{display:grid;grid-template-columns:1.4fr 0.3fr 0.3fr 0.3fr 0.4fr 0.4fr 0.5fr;padding:8px;font-size:11px;text-align:center;border-bottom:1px solid #ffffff11;align-items:center}
.fix{background:#0f172a;padding:8px;border-radius:8px;margin:4px 0;display:flex;justify-content:space-between;align-items:center;font-size:12px;border-left:3px solid #3b82f6}
.hidden{display:none}.small{font-size:10px;color:#94a3b8}

.tab{display:flex;gap:4px;overflow:auto}.tab button{flex:1}
</style></head><body>
<div class="hero">
<div style="display:flex;justify-content:space-between"><div class="logo">🎱 e-<b>BALLER</b> DESK CONTROL</div><div class="small">Loop 0141939000 - FIXED</div></div>
<div id="loginBox" class="card" style="max-width:340px;margin:12px auto;text-align:center">
<h3>PIN: 1234</h3>
<input id="pin" type="password" placeholder="Enter 1234">
<button class="green" style="width:100%" onclick="doUnlock()">Unlock Desk Control</button>
<div id="msg" class="small"></div>
</div>
<div id="main" class="hidden">
<div class="tab"><button class="blue" onclick="showSec('desks')">Desks</button><button class="gold" onclick="showSec('table')">Table</button><button class="green" onclick="showSec('fixtures')">Fixtures</button><button class="gray" onclick="showSec('control')">Referee</button></div>

<div id="tableSec" class="hidden"><div class="card" style="border:1px solid #ffffff22">
<h3 style="margin:0;text-align:center;font-family:Orbitron">LEAGUE STANDINGS - AUTO</h3>
<div class="hrow"><div>👑 PLAYER</div><div>P</div><div>W</div><div>L</div><div>GF</div><div>GA</div><div>PTS</div></div>
<div id="rows"></div>
<div style="display:flex;gap:4px;margin-top:8px"><button class="green" onclick="shareWA('table')">📲 Share Table to WhatsApp</button><button class="blue" onclick="shareWA('fixtures')">📲 Share Fixtures</button></div>
</div></div>
<div id="fixturesSec" class="hidden"><div class="card"><h3>⚡ Auto Fixtures</h3>
<div style="display:flex;gap:4px;margin-bottom:6px"><button class="blue" onclick="autoPick()">🎲 Auto-Pick</button><button class="green" onclick="startNext()">▶️ Start Next</button></div>
<div id="fixtures"></div></div></div>
<div id="controlSec" class="hidden"><div class="card"><h3>🎮 Match Control - Referee Only</h3>
<select id="liveMatch"></select>
<select id="deskSel"><option>Table 1</option><option>Table 2</option><option>Table 3</option><option>Table 4</option><option>Table 5</option><option>Table 6</option><option>Table 7</option><option>Table 8</option></select>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px">

<button class="gold" onclick="postpone()">⏸️ Postpone</button><button class="gray" onclick="rematch()">🔄 Rematch</button>
<button class="red" onclick="disqualify()">🚫 Disqualify</button><button class="red" onclick="cancelMatch()">❌ Cancel Match</button>
</div>
<div id="controlHist" class="small" style="margin-top:8px"></div>
</div></div>
</div>
</div>

function initAll(){calc();if(fixtures.length===0)autoPick();renderAll();}
function calc(){league.forEach(function(t){t.PTS=t.W*3;});league.sort(function(a,b){return b.PTS-a.PTS||b.GF-a.GF;});}
function renderAll(){renderTable();renderDesks();renderFixtures();renderHist();saveAll();}
function renderTable(){var html='';league.forEach(function(t,i){var style=i===0?'background:linear-gradient(90deg,#facc15,#eab308);color:#000;font-weight:900':'';var crown=i===0?'👑':'';html+='<div class="mrow" style="'+style+'"><div>'+(i+1)+'. '+crown+' '+t.name+'</div><div>'+t.P+'</div><div>'+t.W+'</div><div>'+t.L+'</div><div>'+t.GF+'</div><div>'+t.GA+'</div><div style="font-weight:900;color:#facc15">'+t.PTS+'</div></div>';});document.getElementById('rows').innerHTML=html;}
function renderDesks(){var h='';for(var i=1;i<=8;i++){var t='Table '+i;var st=desks[t]||'free';var cls=st==='free'?'free':(st.indexOf('busy')===0?'busy':'post');var txt=st==='free'?'FREE':st;h+='<div class="deskBox '+cls+'" onclick="toggleDesk(\''+t+'\')">'+t+'<br><span style="font-size:10px">'+txt+'</span></div>';}document.getElementById('desks').innerHTML=h;}
