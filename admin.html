<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin 32 EPL</title><style>body{margin:0;background:#0f172a;color:#fff;font-family:system-ui}.h{padding:10px;font-weight:900;background:#37003c;display:flex;justify-content:space-between}.t{display:flex;gap:4px;padding:6px;overflow:auto}.t button{padding:7px 10px;border:0;border-radius:7px;background:#334155;color:#fff;font-weight:700;font-size:11px}.t button.a{background:#fff;color:#000}.b{background:#1e293b;margin:7px;border-radius:10px;padding:9px}.btn{padding:5px 8px;border:0;border-radius:6px;font-weight:800;margin:2px;font-size:10px}.g{background:#22c55e;color:#000}.bl{background:#3b82f6;color:#fff}.y{background:#facc15;color:#000}.r{background:#ef4444;color:#fff}.tb{width:100%;border-collapse:collapse;font-size:10px;margin-top:6px}.tb th{background:#37003c;color:#fff;padding:5px}.tb td{background:#fff;color:#000;padding:5px;border-bottom:1px solid #ddd;text-align:center}.tb td:nth-child(2){text-align:left;font-weight:700}.cb{background:#00ff87;color:#000;padding:2px 6px;border-radius:10px;font-weight:900;font-size:9px}.hi{display:none}.de{background:#0f172a;padding:7px;border-radius:7px;margin:4px 0;border:1px solid #334155;display:flex;justify-content:space-between}.dk{background:#0f172a;padding:6px;border-radius:7px;margin:4px 0;display:flex;justify-content:space-between;border-left:4px solid #22c55e}.dk.by{border-left-color:#ef4444}</style></head><body>
<div class=h><span>E-Baller 32 Paid</span><span id=c style="background:#00ff88;color:#000;padding:2px 6px;border-radius:8px;font-size:10px">0/32</span></div>
<div class=t><button id=t1 class=a onclick="S('d')">Unlock+Approve</button><button onclick="S('f')">Fixtures</button><button onclick="S('l')">Table</button></div>
<div id=d><div class=b><h3 style="color:#facc15;margin:0 0 5px 0;font-size:13px">💰 Approve Payment 714777</h3><div id=dl></div></div><div class=b><h3 style="color:#22c55e;margin:0 0 5px 0;font-size:13px">🎱 Unlock Desk</h3><select id=us><option>Table 1</option><option>Table 2</option><option>Table 3</option><option>Table 4</option><option>Table 5</option><option>Table 6</option><option>Table 7</option><option>Table 8</option></select><button class="btn bl" onclick="U()">Unlock</button><button class="btn y" onclick="UA()">Unlock All</button><div id=ds></div></div><div class=b><h3 style="color:#3b82f6;margin:0 0 5px 0;font-size:13px">🔄 Change Room</h3><table class=tb id=rt></table></div></div>
<div id=f class=hi><div class=b><button class="btn bl" onclick="AP()">🎲 AUTO PICK PAID</button><table class=tb id=pt></table></div></div>
<div id=l class=hi><div class=b style="background:#fff;padding:0;overflow:hidden"><div style="background:#37003c;color:#fff;padding:7px;font-weight:900;font-size:12px">🏴󐁧󐁢󐁥󐁮󐁧󐁿 EPL Table - Paid Only</div><table class=tb id=lt></table></div></div>
<script>
L=JSON.parse(localStorage.getItem("eballer_league32")||"[]");F=JSON.parse(localStorage.getItem("eb_fixtures32")||"[]");D=JSON.parse(localStorage.getItem("eb_deposits")||"[]");K=JSON.parse(localStorage.getItem("eb_desks32")||"{}");for(i=1;i<=8;i++)if(!K["Table "+i])K["Table "+i]="free"
function SV(){localStorage.setItem("eb_fixtures32",JSON.stringify(F));localStorage.setItem("eballer_league32",JSON.stringify(L));localStorage.setItem("eb_deposits",JSON.stringify(D));localStorage.setItem("eb_desks32",JSON.stringify(K))}
function S(id){d.style.display=id=='d'?'':'none';f.style.display=id=='f'?'':'none';l.style.display=id=='l'?'':'none';R()}
function R(){let h="";if(D.length==0)h="<p style=color:#64748b;font-size:11px>No payments yet</p>";for(i=0;i<D.length;i++){let x=D[i],c=x.status=="APPROVED"?"#22c55e":"#f59e0b";h+=`<div class=de><div><b>${x.name}</b><br><small>${x.code} <span style=color:${c}>${x.status}</span></small></div><div>${x.status=="PENDING"?`<button class='btn g' onclick='A(${i})'>APPROVE</button>`:`✅`}</div></div>`}dl.innerHTML=h;let dh="";for(j=1;j<=8;j++){let n="Table "+j,fr=K[n]=="free";dh+=`<div class='dk ${fr?"":"by"}'><div><b>${n}</b><br><small style=color:${fr?"#22c55e":"#ef4444"}>${K[n]}</small></div><div><button class='btn ${fr?"bl":"g"}' onclick="us.value='${n}';U()">${fr?"Free":"Unlock"}</button></div></div>`}ds.innerHTML=dh;let rh="<tr><th>Match</th><th>Now</th><th>Move</th></tr>";for(k=0;k<F.length;k++){if(F[k].status=="complete")continue;let fx=F[k];rh+=`<tr><td style=text-align:left>${fx.a} vs ${fx.b}<br><small>${fx.status}</small></td><td>${fx.table}</td><td><select onchange='CR(${k},this.value)'><option>${fx.table}</option><option>Table 1</option><option>Table 2</option><option>Table 3</option><option>Table 4</option><option>Table 5</option><option>Table 6</option><option>Table 7</option><option>Table 8</option></select></td></tr>`}rt.innerHTML=rh;let fh="<tr><th>MATCH</th><th>STATUS</th><th>ACTION</th></tr>";for(i=0;i<F.length;i++){let fx=F[i],st=fx.status=="complete"?`<span class=cb>COMPLETE</span>`:fx.status.toUpperCase();if(fx.status=="live")st=`<span style=color:#00ff87;font-weight:900>● LIVE</span>`;fh+=`<tr><td style=text-align:left>${fx.a}<br>vs ${fx.b}<br><small>${fx.table}</small>${fx.winner?`<br><small style=color:#22c55e>W:${fx.winner}</small>`:""}</td><td>${st}</td><td>${fx.status=="pending"?`<button class='btn bl' onclick='SL(${i})'>START</button>`:fx.status=="live"?`<button class='btn g' onclick='AW(${i})'>RESULT</button>`:fx.status=="complete"?`<span class=cb>COMPLETE</span>`:""}</td></tr>`}pt.innerHTML=fh;L.sort((a,b)=>b.PTS-a.PTS);let lh="<tr><th>#</th><th>Club</th><th>Pl</th><th>Pts</th></tr>";for(m=0;m<L.length;m++){let bd=m<4?"border-left:3px solid #00ff87":"";if(m>=L.length-3&&L.length>=8)bd="border-left:3px solid #e90052";lh+=`<tr style='${bd}'><td>${m+1}</td><td style=text-align:left>${L[m].name}</td><td>${L[m].P}</td><td style=font-weight:900>${L[m].PTS}</td></tr>`}lt.innerHTML=lh;c.innerText=L.length+"/32";SV()}
function A(i){let d=D[i];if(L.length>=32){alert("32 max");return}d.status="APPROVED";if(!L.some(x=>x.name.toLowerCase()==d.name.toLowerCase()))L.push({name:d.name,P:0,W:0,L:0,PTS:0});for(t=1;t<=8;t++)if(K["Table "+t]=="free"){K["Table "+t]="Reserved "+d.name;break}SV();R();alert(d.name+" APPROVED")}
function U(){K[us.value]="free";SV();R()}function UA(){for(i=1;i<=8;i++)K["Table "+i]="free";SV();R()}
function CR(idx,nt){let ot=F[idx].table;F[idx].table=nt;K[ot]="free";K[nt]="busy: "+F[idx].a+" vs "+F[idx].b;SV();R()}
function AP(){if(L.length<2){alert("Need 2 paid");return}F=[];for(i=1;i<=8;i++)K["Table "+i]="free";for(i=0;i<L.length;i+=2)if(L[i+1]){let t="Table "+((i/2)%8+1);F.push({a:L[i].name,b:L[i+1].name,table:t,status:"pending",winner:""});K[t]="busy: "+L[i].name+" vs "+L[i+1].name}SV();R();S('f')}
function SL(i){F[i].status="live";K[F[i].table]="busy: "+F[i].a+" vs "+F[i].b;SV();R()}
function AW(i){let fx=F[i],w=prompt("Winner? "+fx.a+" OR "+fx.b,fx.a);if(!w)return;fx.winner=w;fx.status="complete";for(j=0;j<L.length;j++){if(L[j].name==fx.a||L[j].name==fx.b)L[j].P++;if(L[j].name==w){L[j].W++;L[j].PTS=L[j].W*3}else if(L[j].name==fx.a||L[j].name==fx.b)L[j].L++}K[fx.table]="free";SV();R()}
R();
</script>
</body></html>
