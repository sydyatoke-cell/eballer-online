<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin 32 EPL - Paid Only</title>
<style>body{margin:0;background:#0f172a;color:#fff;font-family:system-ui}.header{padding:14px;font-weight:900}.tabs{display:flex;gap:8px;padding:0 12px}.tabs button{padding:8px 14px;border:none;border-radius:8px;background:#334155;color:#fff;font-weight:700}.tabs button.active{background:#fff;color:#000}.box{background:#1e293b;margin:12px;border-radius:14px;padding:14px}.btn{padding:7px 12px;border:none;border-radius:7px;font-weight:800;margin:2px}.g{background:#22c55e;color:#000}.b{background:#3b82f6;color:#fff}.y{background:#facc15;color:#000}.r{background:#ef4444;color:#fff}.table{width:100%;border-collapse:collapse;margin-top:10px;font-size:11px}.table th{background:#37003c;color:#fff;padding:8px;font-size:10px}.table td{background:#fff;color:#000;padding:8px;border-bottom:1px solid #ddd;text-align:center}.table td:nth-child(2){text-align:left;font-weight:700}.complete-badge{background:#00ff87;color:#000;padding:3px 8px;border-radius:10px;font-weight:900;font-size:10px}.hidden{display:none}.dep{background:#0f172a;padding:10px;border-radius:8px;margin:6px 0;display:flex;justify-content:space-between;align-items:center}</style>
</head><body>
<div class="header">E-Baller Admin - 32 PLAYERS EPL - Paid Only</div>
<div class="tabs">
<button id="t1" class="active" onclick="showTab('pay')">Payments</button>
<button onclick="showTab('fixtures')">Fixtures - Auto Pick Paid</button>
<button onclick="showTab('table')">Table - EPL - 32 Paid</button>
</div>

<div id="payTab"><div class="box"><h3>💰 Pending M-Pesa - Loop 0141939000</h3><div id="depList"></div></div></div>

<div id="fixturesTab" class="hidden"><div class="box"><div style="display:flex;gap:8px"><button class="btn b" style="flex:1" onclick="autoPick()">🎲 AUTO PICK FROM PAID MEMBERS</button><button class="btn g" style="flex:1" onclick="shareFixtures()">📲 Share Fixtures</button></div><table class="table" id="pendingTable"></table></div></div>

<div id="tableTab" class="hidden"><div class="box" style="background:#fff;padding:0;overflow:hidden"><div style="background:#37003c;color:#fff;padding:10px;font-weight:900">🏴󐁧󐁢󐁥󐁮󐁧󐁿 EPL Table - Only Registered & Paid (32 max)</div><table class="table" id="leagueTable"></table><button class="btn g" style="width:90%;margin:10px 5%" onclick="shareTable()">Share Table to WhatsApp Group</button></div></div>

<script>
var league=JSON.parse(localStorage.getItem("eballer_league32")||"[]");
var fixtures=JSON.parse(localStorage.getItem("eb_fixtures32")||"[]");
var deposits=JSON.parse(localStorage.getItem("eb_deposits")||"[]");
var desks=JSON.parse(localStorage.getItem("eb_desks32")||"{}");
for(var i=1;i<=8;i++){if(!desks["Table "+i]){desks["Table "+i]="free";}}
function save(){localStorage.setItem("eb_fixtures32",JSON.stringify(fixtures));localStorage.setItem("eballer_league32",JSON.stringify(league));localStorage.setItem("eb_deposits",JSON.stringify(deposits));localStorage.setItem("eb_desks32",JSON.stringify(desks));}
function showTab(id){document.getElementById("payTab").classList.add("hidden");document.getElementById("fixturesTab").classList.add("hidden");document.getElementById("tableTab").classList.add("hidden");document.getElementById(id+"Tab").classList.remove("hidden");render();}

function render(){
var depDiv=document.getElementById("depList");
var html="";
if(deposits.length==0){html="<p style=color:#64748b>No deposits yet</p>";}
for(var i=0;i<deposits.length;i++){
var d=deposits[i];
html+="<div class=dep><div><b>"+d.name+"</b> ("+d.phone+")<br><small>"+d.code+" - "+d.amount+" KES - <span style=color:"+(d.status=="APPROVED"?"#22c55e":"#f59e0b")+">"+d.status+"</span></small></div><div>"+(d.status=="PENDING"?"<button class='btn g' onclick='approve("+i+")'>Approve</button>":"✅")+"</div></div>";
}
depDiv.innerHTML=html;

var pt=document.getElementById("pendingTable");
var fhtml="<tr><th>MATCH</th><th>STATUS</th><th>ACTION</th></tr>";
for(var i=0;i<fixtures.length;i++){
var fx=fixtures[i];
var st=fx.status=="complete"?"<span class=complete-badge>COMPLETE</span>":fx.status.toUpperCase();
fhtml+="<tr><td style=text-align:left><b>"+fx.a+" vs "+fx.b+"</b><br><small>"+fx.table+"</small>"+(fx.winner?"<br><small style=color:#22c55e>Winner: "+fx.winner+"</small>":"")+"</td><td>"+st+"</td><td>";
if(fx.status=="pending"){fhtml+="<button class='btn b' onclick='setLive("+i+")'>Start</button>";}
if(fx.status=="live"){fhtml+="<button class='btn g' onclick='award("+i+")'>Result</button><br><button class='btn y' onclick='postpone("+i+")'>Postponed</button><br><button class='btn r' onclick='disq("+i+")'>Disqualify</button>";}
if(fx.status=="complete"){fhtml+="<span class=complete-badge>COMPLETE</span>";}
fhtml+="</td></tr>";
}
pt.innerHTML=fhtml;

league.sort(function(a,b){return b.PTS-a.PTS;});
var lt=document.getElementById("leagueTable");
var lh="<tr><th>#</th><th>Club</th><th>Pl</th><th>W</th><th>Pts</th></tr>";
for(var i=0;i<league.length;i++){
var crown=i==0?"👑 ":"";
lh+="<tr><td>"+(i+1)+"</td><td style=text-align:left>"+crown+league[i].name+"</td><td>"+league[i].P+"</td><td>"+league[i].W+"</td><td style=font-weight:900>"+league[i].PTS+"</td></tr>";
}
if(league.length==0){lh+="<tr><td colspan=5 style=color:#888>Empty - Approve paid members to appear here</td></tr>";}
lt.innerHTML=lh;
save();
}
function approve(i){
var d=deposits[i];
if(league.length>=32){alert("32 max reached");return;}
d.status="APPROVED";
var exists=league.some(function(m){return m.name.toLowerCase()==d.name.toLowerCase();});
if(!exists){league.push({name:d.name,P:0,W:0,L:0,PTS:0});}
save();render();alert(d.name+" Approved - Now in EPL Table!");
}
function autoPick(){
if(league.length<2){alert("Need at least 2 paid members");return;}
fixtures=[];
for(var i=1;i<=8;i++){desks["Table "+i]="free";}
for(var i=0;i<league.length;i+=2){
if(league[i+1]){
var t="Table "+((i/2)%8+1);
fixtures.push({a:league[i].name,b:league[i+1].name,table:t,fee:"50",status:"pending",winner:""});
}
}
render();showTab("fixtures");
}
function setLive(i){fixtures[i].status="live";render();}
function award(i){var fx=fixtures[i];var w=prompt("Winner? "+fx.a+" OR "+fx.b,fx.a);if(!w){return;}fx.status="complete";fx.winner=w;for(var j=0;j<league.length;j++){if(league[j].name==fx.a||league[j].name==fx.b){league[j].P++;}if(league[j].name==w){league[j].W++;league[j].PTS=league[j].W*3;}else if(league[j].name==fx.a||league[j].name==fx.b){league[j].L++;}}render();var txt="✅ COMPLETE - "+fx.a+" vs "+fx.b+"%0AWinner: *"+w+"*";window.open("https://wa.me/?text="+txt,"_blank");}
function postpone(i){fixtures[i].status="postponed";render();}
function disq(i){var fx=fixtures[i];var who=prompt("Disqualify who? "+fx.a+" or "+fx.b,fx.a);if(!who){return;}league=league.filter(function(p){return p.name!=who});fixtures=fixtures.filter(function(f){return f.a!=who && f.b!=who});render();}
function shareTable(){var txt="🏴󐁧󐁢󐁥󐁮󐁧󐁿 *EPL TABLE - PAID MEMBERS ONLY* %0A";for(var i=0;i<league.length;i++){txt+=(i+1)+". "+league[i].name+" Pts:"+league[i].PTS+"%0A";}window.open("https://wa.me/?text="+txt,"_blank");}
function shareFixtures(){var txt="📋 *FIXTURES - PAID MEMBERS* %0A";for(var i=0;i<fixtures.length;i++){var s=fixtures[i].status=="complete"?"COMPLETE":fixtures[i].status.toUpperCase();txt+="• "+fixtures[i].a+" vs "+fixtures[i].b+" ["+s+"]%0A";}window.open("https://wa.me/?text="+txt,"_blank");}
render();
</script>
</body></html>
