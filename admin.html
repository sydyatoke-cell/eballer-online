<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin - E-Baller</title>
<style>body{background:#0a0a0f;color:white;font-family:Arial;padding:10px}.card{background:#1a1a2e;border:2px solid #a855f7;border-radius:15px;padding:15px;margin:10px 0}.btn{padding:12px 20px;border:none;border-radius:8px;font-weight:bold;margin:5px;cursor:pointer}.btn-p{background:#a855f7;color:white}.btn-g{background:#00ff88}.btn-wa{background:#25D366;color:white}.btn-r{background:#ff4444;color:white}</style></head><body>
<script>let p=prompt('Enter Admin Password:');if(p!=='0753'){document.body.innerHTML='<h1>Access Denied</h1>';throw new Error('No access');}</script>
<div class="card"><h2>⚙️ E-BALLER ADMIN - SECRET</h2>
<p id="count"></p>
<button class="btn btn-p" onclick="autoFixtures()">🤖 AUTO PICK FIXTURES (32)</button>
<button class="btn btn-wa" onclick="shareAll()">📤 AUTO SHARE to WhatsApp Group</button>
<button class="btn btn-r" onclick="clearAll()">🗑️ Clear All Data</button>
</div>
<div class="card"><h3>Enter Result (Auto Updates Table)</h3>
<select id="home"></select> <input id="hg" type="number" style="width:40px"> vs <input id="ag" type="number" style="width:40px"> <select id="away"></select>
<button class="btn btn-g" onclick="submitRes()">Submit & Auto Share Result</button>
<div id="list"></div></div>
<script>
const GROUP="https://chat.whatsapp.com/EuhWoFsaY7Y8f6XJYjFeM0";
let players=JSON.parse(localStorage.getItem('eballer_players')||'[]');let fixtures=JSON.parse(localStorage.getItem('eballer_fixtures')||'[]');let table=JSON.parse(localStorage.getItem('eballer_table')||'[]');
document.getElementById('count').innerText=players.length+'/32 Players: '+players.map(p=>p.club).join(', ');
function autoFixtures(){if(players.length<2)return alert('Need players');let teams=[...players];fixtures=[];for(let r=0;r<teams.length-1;r++){for(let i=0;i<teams.length/2;i++){fixtures.push({week:r+1,home:teams[i].club,away:teams[teams.length-1-i].club,played:false}) }teams.splice(1,0,teams.pop());}table=players.map(p=>({Club:p.club,MP:0,W:0,Pts:0}));localStorage.setItem('eballer_fixtures',JSON.stringify(fixtures));localStorage.setItem('eballer_table',JSON.stringify(table));alert('Fixtures Generated!');location.reload();}
let opts=players.map(p=>`<option>${p.club}</option>`).join('');document.getElementById('home').innerHTML=opts;document.getElementById('away').innerHTML=opts;
let l='';fixtures.forEach(f=>{l+=`<div>${f.played?'✅':'⏳'} ${f.home} vs ${f.away} ${f.played?f.hg+'-'+f.ag:''}</div>`});document.getElementById('list').innerHTML=l;
function submitRes(){let h=document.getElementById('home').value,a=document.getElementById('away').value,hg=parseInt(document.getElementById('hg').value),ag=parseInt(document.getElementById('ag').value);let f=fixtures.find(x=>x.home===h&&x.away===a&&!x.played);if(f){f.played=true;f.hg=hg;f.ag=ag;}table.forEach(t=>{if(t.Club===h||t.Club===a)t.MP++;if(hg>ag&&t.Club===h){t.W++;t.Pts+=3}if(ag>hg&&t.Club===a){t.W++;t.Pts+=3}if(hg===ag)t.Pts+=1});localStorage.setItem('eballer_fixtures',JSON.stringify(fixtures));localStorage.setItem('eballer_table',JSON.stringify(table));let msg=`*RESULT* 🔥\n${h} ${hg}-${ag} ${a}\n\n*Table Top 5:*\n`+table.sort((x,y)=>y.Pts-x.Pts).slice(0,5).map((t,i)=>`${i+1}. ${t.Club} - ${t.Pts}pts`).join('\n')+`\n\nGroup: ${GROUP}`;window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`,'_blank');}
function shareAll(){let msg=`*E-BALLER WEEKLY UPDATE* 🏆\n\n*Fixtures:*\n`+fixtures.filter(f=>!f.played).slice(0,5).map(f=>`${f.home} vs ${f.away}`).join('\n')+`\n\n*Table:*\n`+table.sort((a,b)=>b.Pts-a.Pts).slice(0,10).map((t,i)=>`${i+1}. ${t.Club} - ${t.Pts}pts`).join('\n')+`\n\nhttps://sydyatoke-cell.github.io/eballer-online/\nGroup: ${GROUP}`;window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`,'_blank');}
function clearAll(){if(confirm('Delete all?')){localStorage.clear();alert('Cleared');location.reload();}}
</script></body></html>
